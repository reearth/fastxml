name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test --lib --all-features

  test-libxml:
    name: Test with libxml comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - name: Run tests with libxml comparison
        run: cargo test --features compare-libxml

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  # Single aggregating gate: this is the only status check that needs to be
  # marked "required" in the branch-protection rule (the required check is
  # named "CI"). It turns green only after every CI job above has finished
  # successfully, and red if any of them fails or is cancelled. `if: always()`
  # ensures it always reports a definitive pass/fail (never "skipped"), so it
  # never leaves the merge in a pending state when an upstream job fails.
  ci-success:
    name: CI
    if: always()
    needs: [fmt, clippy, test, test-libxml, doc]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs succeeded
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "Upstream job results: ${results}"
          if [[ "${results}" == *failure* || "${results}" == *cancelled* ]]; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All CI jobs succeeded."
