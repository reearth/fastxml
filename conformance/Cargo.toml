[package]
name = "fastxml-conformance"
version = "0.1.0"
edition = "2024"
description = "Conformance test suite for fastxml - W3C/OASIS standard compliance testing"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
fastxml = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
ureq = "2"
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[[bin]]
name = "download"
path = "src/bin/download.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"
